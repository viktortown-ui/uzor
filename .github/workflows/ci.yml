name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  forecast-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Create minimal Supabase prerequisites
        run: psql --set ON_ERROR_STOP=1 --file scripts/forecast-postgres-prerequisites.sql
      - name: Apply forecast migration in isolated PostgreSQL
        run: psql --set ON_ERROR_STOP=1 --file supabase/migrations/007_forecast_persistence_deadline_v1.sql
      - name: Run forecast database smoke tests
        run: psql --set ON_ERROR_STOP=1 --file scripts/forecast-postgres-smoke.sql

  forecast-outcome-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Create minimal Supabase prerequisites
        run: psql --set ON_ERROR_STOP=1 --file scripts/forecast-postgres-prerequisites.sql
      - name: Apply forecast migration in isolated PostgreSQL
        run: psql --set ON_ERROR_STOP=1 --file supabase/migrations/007_forecast_persistence_deadline_v1.sql
      - name: Apply outcome resolution migration in isolated PostgreSQL
        run: psql --set ON_ERROR_STOP=1 --file supabase/migrations/008_forecast_outcome_resolution_v1.sql
      - name: Run outcome resolution database smoke tests
        run: psql --set ON_ERROR_STOP=1 --file scripts/forecast-outcome-postgres-smoke.sql

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: lts/*, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Build PWA at root base
        run: npm run build
        env:
          VITE_BASE_PATH: /

      - name: Build PWA at GitHub Pages base
        run: npm run build
        env:
          VITE_BASE_PATH: /uzor/

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Chromium PWA installability
        run: npm run test:pwa-installability
